name: Download Offline Packages

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 3.12
        required: true
        default: '3.13'
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.13'

jobs:
  download:
    runs-on: windows-latest

    steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Download Packages
      shell: pwsh
      run: |
        $pyVersion = "${{ inputs.python_version }}".Replace(".", "")
        Write-Host "Downloading packages for Python 3.$pyVersion on Windows 64-bit..."
        
        mkdir offline_packages
        
        # استفاده از سویچ --only-binary=:all: برای جلوگیری از ارور کراس‌پلتفرم
        pip download numpy `
          --platform win_amd64 `
          --python-version $pyVersion `
          --abi cp$pyVersion `
          --only-binary=:all: `
          -d offline_packages

    - name: Upload Zip Artifact
      uses: actions/upload-artifact@v4
      with:
        name: python${{ inputs.python_version }}_offline_packages
        path: offline_packages/
